<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213D"/>
      <stop offset="50%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="purpleGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a73ea"/>
      <stop offset="50%" stop-color="#7057D9"/>
      <stop offset="100%" stop-color="#553dbb"/>
    </linearGradient>
    <linearGradient id="tealGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4eecd0"/>
      <stop offset="100%" stop-color="#35B8A0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Background for Android Maskable Shapes -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Centered Safe-Zone Content (Scale 0.72 inside 80% circle) -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)">
    <!-- Main Ribbon Arc (Purple) -->
    <path d="M 330 155 C 330 155, 190 145, 175 220 C 160 285, 340 280, 335 345 C 330 405, 180 400, 160 365" 
          fill="none" 
          stroke="url(#purpleGradMask)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Accent Energy Arc (Teal) -->
    <path d="M 325 340 C 320 395, 195 395, 175 365" 
          fill="none" 
          stroke="url(#tealGradMask)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Graduation Cap / Diamond Emblem at Apex -->
    <polygon points="256,105 320,135 256,165 192,135" fill="url(#tealGradMask)"/>
    <circle cx="256" cy="135" r="8" fill="#F8F9FC"/>

    <!-- Sparkle Star in Upper Right -->
    <path d="M 390 110 Q 390 135 415 135 Q 390 135 390 160 Q 390 135 365 135 Q 390 135 390 110 Z" 
          fill="url(#tealGradMask)"/>
    <circle cx="390" cy="135" r="3" fill="#ffffff"/>
  </g>
</svg>
