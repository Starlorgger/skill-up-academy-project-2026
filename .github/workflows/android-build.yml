name: Build SkillUp Academy Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APK and AAB (Play Store Bundle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Build to Native Android Assets
        run: npx cap sync android

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (For Direct Phone Testing)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Android App Bundle (.aab for Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillUp-Academy-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillUp-Academy-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
